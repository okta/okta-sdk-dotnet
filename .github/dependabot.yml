version: 2
updates:
  # src/Okta.Sdk/Okta.Sdk.csproj is generated from openapi3/templates/netcore_project.mustache,
  # so it is intentionally not listed here; bump versions in the template instead.
  - package-ecosystem: "nuget"
    directories:
      - "/src/Okta.Sdk.Extensions"
      - "/src/Okta.Sdk.IntegrationTest"
      - "/src/Okta.Sdk.UnitTest"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "UTC"
    open-pull-requests-limit: 15
    groups:
      identity-model:
        patterns:
          - "Microsoft.IdentityModel.*"
          - "System.IdentityModel.*"
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    labels:
      - "dependencies"
      - "nuget"
